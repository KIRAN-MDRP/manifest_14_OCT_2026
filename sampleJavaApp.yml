apiVersion: v1
kind: ReplicationController
metadata:
  name: java-app-rc
spec:
  replicas: 4
  selector:
    app: java-app
  template:
    metadata:
      name: java-app
      labels:
        app: java-app
    spec:
      containers:
        - name: java-app-container
          image: kirankumarmandarapu/app1_10_10_2026:5
          ports:
            - containerPort: 8080
