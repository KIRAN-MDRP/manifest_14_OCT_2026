apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-deploy
  labels:
    app: java-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
       - name: java-app-container
         image: 745125233316.dkr.ecr.us-east-1.amazonaws.com/secondapp3:2
         imagePullPolicy: Always
         ports:
          - containerPort: 8080
         imagePullSecrets:
          - name: ecr-secret   