apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-deploy
  labels:
    app: java-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
       - name: java-app-container
         image: kirankumarmandarapu/app1_10_10_2026:5
         ports:
          - containerPort: 8000