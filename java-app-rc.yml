apiVersion: v1
kind: ReplicationController
metadata:
  name: java-app-rc
spec:
  replicas: 4
  selector:
    app: java-app
    version: 1.0.1
  template:
    metadata:
      labels:
        app: java-app
        version: 1.0.1
    spec:
      containers:
       - name: java-app-container
         image: kirankumarmandarapu/app1_10_10_2026:5
         ports:
          - containerPort: 8080    
      